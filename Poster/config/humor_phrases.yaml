# Фразы юмора Poster — отдельный каталог для правки владельцем (этап 2.4 P4).
#
# Это НЕ ui_texts.yaml: юмор живёт своим файлом, чтобы редкие шутки не
# смешивались с обязательными текстами экранов.
#
# Как пользоваться: см. Poster/docs/ui_texts.md. Коротко:
#   1. правьте только строки списка, ключ `humor.phrases` не переименовывайте;
#   2. проверка: .venv/bin/python -m utils.ui_humor (из каталога Poster);
#   3. применение: systemctl --user restart poster-bot.
#
# Правила формата:
# - `humor.phrases` — список непустых строк в кавычках, по одной фразе на
#   элемент; порядок и количество фраз менять можно (механика 1% и выбора
#   фразы от этого не меняется);
# - фразы короткие, нейтральные, без подстановки данных пользователя:
#   {переменных} здесь нет и быть не должно;
# - фразы показываются в обычном тексте Telegram с HTML-разметкой экрана:
#   символы < > & не используйте. Файл с такими символами будет ОТКЛОНЁН
#   целиком (ошибка в логе), и бот заработает на встроенных фразах
#   (utils/ui_humor.DEFAULT_JOKES) — экран при этом не ломается;
# - юмор никогда не появляется в анонсах, ошибках, алертах и предупреждениях
#   о потере данных — это правило кода, а не файла;
# - пустой список, битый YAML или отсутствие файла не ломают бота: он
#   работает на встроенных фразах (utils/ui_humor.py) и пишет WARNING в лог.

humor:
  phrases:
    - "Анонс пока пуст — как сцена до саундчека. Заполните поле или отправьте фото."
    - "Пусто, но интригующе. Добавьте хотя бы одно слово — и это уже анонс."
    - "Пока это самый лаконичный анонс в истории. Разбавим?"
    - "Поле ждёт вас, как зритель у кассы. Одно слово — и представление начнётся."
    - "Не спешите: даже у великих анонсов сначала была пустая строка."
    - "Пока здесь тишина. Хороший повод сказать что-то важное."
    - "Без паники: пустое поле — это ещё не провал, а пауза перед выходом."
    - "Коротко и по делу — тоже вариант. Но одно слово всё-таки добавьте."
