# config/rich_content.yaml
#
# Единственный источник содержимого двух Rich Message Poster — «Помощь» и
# «О проекте» (финальное задание 2026-11-08 §13–§15).
#
# Тексты утверждены владельцем дословно: литературная правка не проводится.
# Python (`utils/rich_content.py`, `help_rich.py`, `about_rich.py`) только
# загружает, проверяет и отображает этот файл.
#
# Устройство:
#
#   help: / about:
#     title:     главный заголовок Rich Message;
#     intro:     необязательное введение (пустая строка — без вступления);
#     hint:      короткая служебная подсказка о свёрнутых разделах;
#     sections:  список разделов; каждый раздел — раскрываемый блок
#                (`details`), изначально свёрнутый.
#
# Блоки раздела (белый список; других ключей быть не может):
#
#   paragraph: "текст"                 — простой абзац;
#   paragraph: [часть, часть, ...]     — абзац из частей:
#                                         "текст",
#                                         {link: {text: ..., url: ...}},
#                                         {bold: "текст"};
#   list: [пункт, пункт, ...]          — маркированный список;
#   table: {header: [...], rows: [[...]], compact: true}
#                                      — Rich-таблица (первая строка —
#                                        заголовочная, ячейки `is_header`);
#   quote: "текст"                     — Rich-цитата;
#   quote: {text: "текст", credit: "автор"} — цитата с подписью;
#   details: {summary: ..., blocks: [...]} — вложенный раскрываемый блок
#                                        (в разделах не используется);
#   slideshow: [{id: ..., file: ...}]  — настоящее Rich-слайд-шоу: файлы
#                                        лежат в проекте, `id` — имя медиа.
#
# Медиа слайд-шоу отправляется только при наличии файла. Если файла нет,
# раздел уходит без слайд-шоу, а в лог пишется предупреждение: замену
# картинкам не генерировать (§15.3, §20).

help:
  title: "Помощь"
  # §13: «Без вступлений вроде „Здесь вы узнаете…“». Поле оставлено пустым
  # осознанно: схема каталога общая у обеих страниц, а вступление запрещено.
  intro: ""
  hint: "Нажмите на название раздела, чтобы его открыть."
  sections:
    - id: "create-announcement"
      title: "Создание анонса"
      blocks:
        - paragraph: "Для анонса площадки бот использует её стандартный шаблон и уже известные сведения: адрес, ссылки и прочее."
        - paragraph: "Можно создавать анонсы и по личным шаблонам, без привязки к какой-либо площадке."
        - paragraph: "Пока вы отвечаете на вопросы, бот собирает пост. После создания его можно отредактировать."

    - id: "places"
      title: "Площадки"
      blocks:
        - paragraph: "В «Лекале» есть общий справочник площадок. Каждой можно задать город, адрес, ссылки и свой шаблон анонсов."
        - paragraph: "Добавьте площадку один раз — и организаторам больше не придётся всякий раз вбивать одни и те же сведения."
        - paragraph: "А ещё через справочник можно находить новые пространства в своём городе и за его пределами."

    - id: "templates-and-bricks"
      title: "Шаблоны и кирпичики"
      blocks:
        - paragraph: "Шаблон — это заготовка анонса. Какую информацию собирать, куда её вставлять и как оформлять — решаете вы."
        - paragraph: "Кирпичики — отдельные поля шаблона. Например, вместо [дата] бот подставит дату мероприятия, а вместо [ведущий] — имя ведущего."
        - table:
            header:
              - "В шаблоне"
              - "В анонсе"
            rows:
              - ["[название]", "Читка пьесы"]
              - ["[дата]", "9 ноября"]
              - ["[время]", "19:00"]
            compact: true
        - paragraph: "Можно делать свои шаблоны и кирпичики, хоть под лекции, хоть под концерты, хоть под квартирники."

    - id: "extra-fields"
      title: "Дополнительные поля"
      blocks:
        - paragraph: "Не каждому мероприятию нужны цена, регистрация или список выступающих."
        - paragraph: "У площадки может быть дополнительный шаблон — его включает администратор. Тогда бот сможет собирать анонсы в простом или расширенном варианте, в зависимости от заполненных полей."
        - paragraph: "Один шаблон — разные случаи."

    - id: "photos"
      title: "Фотографии"
      blocks:
        - paragraph: "К анонсу можно добавить до десяти картинок. Рекомендую одну, квадратную (1:1)."
        - paragraph: "Картинки можно менять и после создания поста."

    - id: "editing-and-publication"
      title: "Редактирование и публикация"
      blocks:
        - paragraph: "Необязательно пытаться предусмотреть в шаблоне вообще всё. «Лекало» собирает основу анонса, а что-то можно дописать самому уже перед публикацией."
        - paragraph: "Советую не копировать текст из бота, а пересылать готовое сообщение. Так сохраняются оформление и фотографии."
        - slideshow:
            - id: "help-forward"
              file: "assets/rich/help_forward.png"
            - id: "help-schedule"
              file: "assets/rich/help_schedule.png"
        - paragraph: "Лучше сначала отправить анонс в «Избранное» или отложку канала, чтобы внести последние правки."
        - paragraph: "Все созданные анонсы остаются в разделе «Мои анонсы»."

    - id: "good-announcement"
      title: "Как написать хороший анонс"
      blocks:
        - paragraph: "«Лекало» умеет собирать пост по шаблону, но само мероприятие за вас не опишет."
        - paragraph: "Мне кажется, хороший анонс должен с первого взгляда давать человеку понять, стоит ли ему читать дальше. А если заинтересовался — объяснить, что его ждёт."
        - paragraph:
            - bold: "Не превращайте мероприятие в загадку."
            - " Если зовёте на читку пьесы, расскажите, что будете читать и как всё устроено. Если на дискуссию — о чём собираетесь спорить. Не ограничивайтесь названием, которое понятно только постоянным посетителям."
        - quote: "Приходите на читку пьесы. Будет интересно!"
        - quote: "Читаем пьесу по ролям. Можно прийти послушать или самому взять роль. Готовиться заранее не нужно."
        - paragraph:
            - bold: "Подумайте о человеке, который придёт впервые."
            - " Нужно ли ему что-нибудь знать или готовить заранее? Можно ли просто прийти и послушать? Будут ли рады его участию? Не заставляйте гостей разбираться во всём уже на пороге."
        - paragraph:
            - bold: "Передавайте атмосферу площадки."
            - " Где-то люди приходят на готовую программу, где-то могут пообщаться с организаторами и сами повлиять на происходящее. Это тоже важно. Анонс — первое знакомство человека с вашим пространством."
        - paragraph: "Всё это можно заложить и в сам шаблон, чтобы потом не вспоминать каждый раз."

    - id: "place-management"
      title: "Управление площадкой"
      blocks:
        - paragraph: "Администраторы могут менять сведения о площадке, её шаблон и кирпичики, добавлять кураторов и подвалы, а также назначать других администраторов."

    - id: "errors-and-suggestions"
      title: "Ошибки и предложения"
      blocks:
        - paragraph: "Нашли баг или что-то неудобное — отправьте /report."
        - paragraph: "Команда работает даже во время создания анонса. Разработчику придёт ваше описание проблемы и журнал действий за последний час, без содержимого сообщений."

about:
  title: "О проекте"
  # §14: главный заголовок и разделы; вступления нет.
  intro: ""
  hint: "Нажмите на название раздела, чтобы его открыть."
  sections:
    - id: "why"
      title: "Зачем я это сделал"
      blocks:
        - paragraph:
            - "Я занимаюсь анонсами с 2021 года — с тех пор, как попал в коммунарское сообщество Москвы и начал делать площадки для мероприятий. Сейчас я коммунар «"
            - link:
                text: "РанДома Культуры"
                url: "https://t.me/random_culture"
            - "»."
        - paragraph: "За эти годы я научился сходу сваять анонс почти в любом формате. Но часто получаю от оргов полотна текста, из которых приходится выуживать название, дату и суть мероприятия. На других площадках вижу ту же историю: анонсы нередко делают абы как. Скорее всего, не хватает опыта и ресурсов."
        - paragraph: "А ведь хороший анонс должен с первого взгляда давать понять, что за мероприятие, когда и где оно проходит. И не оставлять человека гадать, что его ждёт на площадке."
        - paragraph: "Да и нам самим ещё есть куда расти. Но чтобы прыгнуть выше, нужно сделать новую опору."

    - id: "how"
      title: "Как я делал «Лекало»"
      blocks:
        - paragraph: "В начале 2025 года я уже пытался навайбкодить бота для анонсов. Первая версия даже работала, но мне хотелось сделать инструмент, который подойдёт не только моей площадке. Тогда не хватило ни навыков, ни возможностей нейросетей."
        - paragraph: "Осенью 2026-го я вернулся к разработке. Научился пользоваться OpenCode, собрал команду нейроагентов и взялся за дело."
        - paragraph: "Я делал проект один, с помощью DeepSeek и GLM: сам придумывал, как всё должно работать, ставил задачи нейросетям и проверял результат. Больше недели каждый день добавлял функции, находил ошибки и переделывал то, что не нравилось. Особенно много времени ушло на тестирование."
        - paragraph: "На запросы к нейросетям потратил около 15 тысяч рублей. Для меня это немало, но результатом я доволен."

    - id: "result"
      title: "Что получилось"
      blocks:
        - paragraph: "Мне было важно сделать бота не только для РанДома. У каждой площадки свои стандарты, и я не хотел навязывать всем один формат."
        - paragraph: "Поэтому в «Лекале» можно собирать собственные шаблоны из кирпичиков — полей, которые каждый пользователь или администратор площадки может настроить под себя. Бот позволяет делать анонсы самых разных форматов."
        - paragraph: "Адрес, метро, ссылки и другие постоянные сведения не нужно каждый раз копировать вручную. А чтобы ботом было приятно пользоваться, я отдельно заморочился над интерфейсом: он не засыпает чат сообщениями, а обновляет уже существующие."

    - id: "hopes"
      title: "На что я надеюсь"
      blocks:
        - paragraph: "Хочется, чтобы «Лекало» разошлось по низовым сообществам и со временем помогло поднять общий уровень качества анонсов независимых площадок."
        - paragraph: "Надеюсь, что в разных городах люди будут узнавать о новых пространствах в том числе через список площадок в боте."
        - paragraph: "Ну и если РанДому за эту работу достанется немного славы, я буду только рад."

    - id: "open-source"
      title: "Открытый код"
      blocks:
        - paragraph: "Опенсорс — моя принципиальная позиция. Надеюсь, кто-нибудь возьмёт мой код и сделает что-то намного лучше. Пусть даже нынешнее «Лекало» отправится в топку разработки новой версии."
        - paragraph:
            - link:
                text: "Исходный код на GitHub"
                url: "https://github.com/a-quilam/lekalo_app"

    - id: "support"
      title: "Как помочь и связаться"
      blocks:
        - paragraph: "Мне нужны отзывы и предложения, чтобы окончательно отполировать бота. Нашли баг или что-то некрасивое — пишите /report."
        - paragraph: "Если «Лекало» пригодилось, поделитесь им с товарищами."
        - paragraph: "Надеюсь, со временем разработка окупится и я смогу взяться за новые инструменты для низовых сообществ. Идей хватает, теперь вопрос в финансах."
        - paragraph:
            - bold: "Если хотите поддержать меня рублём — напишите в Telegram, расскажу, как задонатить по СБП."
        - paragraph:
            - link:
                text: "Написать мне в Telegram"
                url: "https://t.me/a_quilam"
        - paragraph:
            - link:
                text: "Мои записи в Мастодоне"
                url: "https://kommuverse.ru/@mush"
