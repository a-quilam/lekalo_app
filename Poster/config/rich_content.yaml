# config/rich_content.yaml
# «Помощь» и «О проекте» — редакция с визуальной иерархией.
# Сохраняет ID разделов, ссылки, таблицу и два изображения.
# Разделители отделяют смысловые группы; не используются пустые элементы текста.

help:
  title: "Помощь"
  intro: ""
  hint: "Нажмите на название раздела, чтобы его открыть."
  sections:

    - id: "create-announcement"
      title: "Создание анонса"
      blocks:
        - paragraph: "Начать можно двумя способами:"
        - list:
            - [{bold: "📍 Создать для площадки"}, " — выберите площадку из справочника. Бот возьмёт её шаблон, адрес и ссылки."]
            - [{bold: "📝 Создать по личному шаблону"}, " — для анонса без привязки к площадке. Сначала доступен стандартный шаблон, позже его можно изменить."]
        - divider: null
        - paragraph:
            - bold: "Дальше бот задаст вопросы"
            - " о названии, дате, времени, описании и других полях шаблона. Необязательное можно пропустить."
        - paragraph: "В конце получится готовый пост. Его можно проверить, поправить и позже найти в «Моих анонсах»."

    - id: "editing-and-publication"
      title: "Редактирование и публикация"
      blocks:
        - paragraph:
            - bold: "Исправить ответ."
            - " Откройте готовый анонс и измените нужное поле. Фотографии тоже можно заменить."
        - divider: null
        - paragraph:
            - bold: "Дописать текст перед публикацией."
            - " Перешлите готовый пост, а не копируйте его: так сохраняются оформление и фотографии."
        - slideshow:
            - id: help-forward
              file: assets/rich/help_forward.png
            - id: help-schedule
              file: assets/rich/help_schedule.png
        - paragraph:
            - bold: "Не отправляйте недоделанный пост сразу в канал."
            - " Сначала поместите его в отложенные сообщения: там можно выбрать «Изменить» и внести последние правки."

    - id: "places"
      title: "Площадки"
      blocks:
        - paragraph: "В общем справочнике можно выбрать площадку для анонса или найти новое пространство в другом городе."
        - list:
            - "У площадки сохраняются адрес, ссылки и собственный шаблон — их не нужно вводить для каждого мероприятия."
            - "Если площадки ещё нет, её можно добавить в справочник."
        - divider: null
        - paragraph:
            - bold: "Кто может менять сведения?"
            - " Администраторы площадки. Организаторы используют её шаблон при создании анонса."

    - id: "templates-and-bricks"
      title: "Шаблоны и кирпичики"
      blocks:
        - list:
            - [{bold: "Шаблон"}, " — заготовка поста: порядок текста и оформление."]
            - [{bold: "Кирпичики"}, " — поля, которые бот заполняет вашими ответами."]
        - table:
            header: ["В шаблоне", "В анонсе"]
            rows:
              - ["[название]", "Читка пьесы"]
              - ["[дата]", "9 ноября"]
              - ["[время_начала]", "19:00"]
            compact: true
        - divider: null
        - paragraph: "Можно создавать свои кирпичики, менять порядок полей и оформление. Личный шаблон настраиваете вы, шаблон площадки — её администраторы."

    - id: "extra-fields"
      title: "Дополнительные поля"
      blocks:
        - paragraph: "Не каждому мероприятию нужны время окончания, условия входа или дополнительные контакты. Для этого у площадки может быть расширенный вариант шаблона: его включает администратор."
        - divider: null
        - list:
            - [{bold: "Куратор"}, " — выбирается из списка площадки или указывается вручную."]
            - [{bold: "Подвал"}, " — готовое напоминание в конце анонса: например, как найти вход или где оставить донат."]
        - paragraph: "Ненужные дополнительные поля можно не заполнять — в готовом посте они не появятся."

    - id: "photos"
      title: "Фотографии"
      blocks:
        - list:
            - ["Можно прикрепить ", {bold: "до десяти изображений"}, "."]
            - ["Советую ", {bold: "одну квадратную картинку (1:1)"}, ", но можно отправить несколько."]
            - "Фотографии можно поменять и после создания анонса."

    - id: "good-announcement"
      title: "Как написать хороший анонс"
      blocks:
        - paragraph: "«Лекало» оформит пост, но о самом мероприятии лучше рассказать конкретно: что будет происходить, можно ли участвовать и нужна ли подготовка."
        - divider: null
        - paragraph:
            - bold: "Слишком расплывчато:"
        - quote: "Приходите на читку пьесы. Будет интересно!"
        - paragraph:
            - bold: "Понятнее:"
        - quote: "Читаем пьесу по ролям. Можно послушать или самому взять роль. Готовиться заранее не нужно."
        - divider: null
        - paragraph: "Подумайте о тех, кто придёт впервые. Если нужна запись, сменная обувь или знание правил участия, напишите об этом. Повторяющиеся пояснения можно добавить в шаблон."

    - id: "place-management"
      title: "Управление площадкой"
      blocks:
        - paragraph: "Администраторы площадки могут:"
        - list:
            - "редактировать адрес, ссылки и другие сведения;"
            - "настраивать шаблон, кирпичики и дополнительные поля;"
            - "вести списки кураторов и подвалов;"
            - "назначать других администраторов."

    - id: "errors-and-suggestions"
      title: "Ошибки и предложения"
      blocks:
        - paragraph:
            - bold: "Нашли баг или неудобство — отправьте /report."
            - " Команда работает и во время создания анонса."
        - divider: null
        - paragraph: "Разработчик получит ваше описание и журнал действий за последний час, но не содержимое сообщений."

about:
  title: "О проекте"
  intro: ""
  hint: "Нажмите на название раздела, чтобы его открыть."
  sections:

    - id: "why"
      title: "Зачем я это сделал"
      blocks:
        - paragraph:
            - "Я занимаюсь анонсами с 2021 года — с тех пор, как попал в коммунарское сообщество Москвы и начал делать площадки для мероприятий. Сейчас я коммунар «"
            - link:
                text: "РанДома Культуры"
                url: https://t.me/random_culture
            - "»."
        - divider: null
        - paragraph: "За эти годы я научился сходу ваять анонс почти в любом формате. Но от оргов часто приходят полотна текста, из которых приходится выуживать название, дату и суть мероприятия. На других площадках вижу то же самое: анонсы нередко делают абы как."
        - divider: null
        - paragraph:
            - bold: "Хороший анонс должен сразу объяснять, что, когда и где происходит,"
            - " а затем — чего ждать человеку на площадке. У организаторов не всегда хватает опыта и времени, чтобы всё это собрать."
        - paragraph: "Нам самим ещё есть куда расти. Чтобы прыгнуть выше, нужна новая опора — так и появилась идея «Лекала»."

    - id: "how"
      title: "Как я делал «Лекало»"
      blocks:
        - paragraph:
            - bold: "Начало 2025 года."
            - " Я уже пытался навайбкодить бота для анонсов. Первая версия работала, но сделать инструмент не только для своей площадки тогда не получилось."
        - divider: null
        - paragraph:
            - bold: "Осень 2026-го."
            - " Я вернулся к проекту, освоил OpenCode и собрал команду нейроагентов. Сам придумывал, как всё должно работать, ставил задачи DeepSeek и GLM и проверял результат."
        - paragraph: "Больше двух недель каждый день добавлял функции, искал ошибки и переделывал неудачные решения. Особенно много времени ушло на тесты."
        - divider: null
        - paragraph:
            - "На запросы к нейросетям потратил около "
            - bold: "15 тысяч рублей"
            - " — для меня это немало, но результатом я доволен."

    - id: "result"
      title: "Что получилось"
      blocks:
        - paragraph: "Мне было важно сделать бота не только для РанДома. У каждой площадки свои стандарты, и я не хотел навязывать всем один формат."
        - paragraph:
            - "Поэтому в «Лекале» можно "
            - bold: "собирать собственные шаблоны из кирпичиков"
            - " — полей, которые каждый пользователь или администратор площадки может настроить под себя. Бот позволяет делать анонсы самых разных форматов."
        - paragraph: "Адрес, метро, ссылки и другие постоянные сведения не нужно каждый раз копировать вручную. А чтобы ботом было приятно пользоваться, я отдельно заморочился над интерфейсом: он не засыпает чат сообщениями, а обновляет уже существующие."

    - id: "hopes"
      title: "На что я надеюсь"
      blocks:
        - paragraph: "Мне хотелось сделать бота не только для РанДома. У каждой площадки свои стандарты, поэтому я не хотел навязывать всем один формат."
        - divider: null
        - paragraph: "Надеюсь, «Лекало» пригодится низовым сообществам: поможет делать анонсы понятнее, а через справочник люди будут находить новые пространства и в других городах."
        - paragraph: "Если РанДому за эту работу достанется немного славы, я буду только рад."

    - id: "open-source"
      title: "Открытый код"
      blocks:
        - paragraph:
            - bold: "Опенсорс — моя принципиальная позиция."
            - " Надеюсь, кто-нибудь возьмёт код и сделает что-то лучше. Пусть даже нынешнее «Лекало» отправится в топку разработки новой версии."
        - divider: null
        - paragraph:
            - link:
                text: "Исходный код на GitHub"
                url: https://github.com/a-quilam/lekalo_app

    - id: "support"
      title: "Как помочь и связаться"
      blocks:
        - paragraph: "Мне нужны отзывы, предложения и советы, чтобы окончательно отполировать бота. Нашли баг или что-то некрасивое — пишите /report. Если «Лекало» пригодилось, поделитесь им с товарищами."
        - divider: null
        - paragraph: "Хочется, чтобы разработка со временем окупилась и я мог взяться за другие инструменты для низовых сообществ. Идей хватает, вопрос в финансах."
        - paragraph:
            - bold: "Поддержать разработку:"
        - list:
            - [{link: {text: "Через ЮMoney", url: "https://yoomoney.ru/fundraise/1LFG7EPRP2C.261110"}}]
            - ["Через СБП — ", {link: {text: "написать мне в Telegram", url: "https://t.me/a_quilam"}}]
        - paragraph: "Сейчас собрано 0 из 15 000 ₽, потраченных на разработку бота."
        - divider: null
        - paragraph:
            - link:
                text: "Мои мысли в Мастодоне"
                url: https://kommuverse.ru/@mush